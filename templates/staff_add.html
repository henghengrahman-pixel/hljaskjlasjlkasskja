{% extends 'base.html' %}{% block page_title %}Tambah Staf{% endblock %}{% block content %}<div class="page-head"><div><h1>Tambah Staf Baru</h1><p>Input staf dan akun login dalam satu langkah.</p></div><a class="btn secondary" href="{{url_for('staff_page')}}">← Kembali</a></div><form method="post" action="{{url_for('staff_page')}}" class="card formgrid pro-form"><label>Nama Lengkap<input name="name" required></label><label>Kode Agent<input name="agent_code"></label><label>Kantor<select name="office_id" required><option value="">Pilih kantor</option>{% for o in offices %}<option value="{{o.id}}">{{o.name}}</option>{% endfor %}</select></label><label>Gender<select name="gender"><option value="Pria">Pria</option><option value="Wanita">Wanita / Cewek</option></select></label><label>Username Telegram<input name="telegram_username" placeholder="tanpa @"></label><label>Telegram ID<input name="telegram_id" placeholder="opsional"></label><label>Email Kerja<input type="email" name="email"></label><label>Nama CS<input name="cs_name"></label><label>Jabatan<select name="position"><option>CS</option><option>Leader</option><option>Supervisor</option><option>Admin</option></select></label><label>Status<select name="status"><option>Aktif</option><option>Nonaktif</option></select></label><label>Tanggal Masuk<input type="date" name="join_date"></label><label>ID Login<input name="login_id" required></label><label>Password Login<input type="password" name="password" minlength="8" required></label><label class="span-4">Catatan<textarea name="notes"></textarea></label><div class="form-actions span-4"><button class="btn">Simpan Staf & Akun</button></div></form>{% endblock %}
