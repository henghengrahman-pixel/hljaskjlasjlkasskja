{% extends 'base.html' %}{% block content %}<h1>Jobdesk Harian</h1><form method="post" class="card formgrid"><input type="date" name="work_date" value="{{date}}" required><select name="office_id">{% for o in offices %}<option value="{{o.id}}">{{o.name}}</option>{% endfor %}</select><select name="shift_id">{% for s in shifts %}<option value="{{s.id}}">{{s.name}} {{s.start_time}}–{{s.end_time}}</option>{% endfor %}</select><select name="staff_id">{% for s in staff %}<option value="{{s.id}}">{{s.name}} — {{s.cs_name}}</option>{% endfor %}</select><select name="channel_id">{% for c in channels %}<option value="{{c.id}}">{{c.name}} — {{c.category}}</option>{% endfor %}</select><input type="time" name="start_time"><input type="time" name="end_time"><button>Simpan Jobdesk</button></form><table><tr><th>Tanggal</th><th>Kantor</th><th>Shift</th><th>Staf</th><th>CS</th><th>Jobdesk</th><th>Jam</th></tr>{% for r in rows %}<tr><td>{{r.work_date}}</td><td>{{r.office_name}}</td><td>{{r.shift_name}}</td><td>{{r.staff_name}}</td><td>{{r.cs_name}}</td><td>{{r.channel_name}}</td><td>{{r.start_time}}–{{r.end_time}}</td></tr>{% endfor %}</table>{% endblock %}
