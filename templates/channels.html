{% extends 'base.html' %}{% block content %}<div class="page-head"><div><h1>Jenis Jobdesk</h1><p>Atur semua jobdesk yang akan dipakai pada board dan auto cek deposit.</p></div></div><form method="post" class="card formgrid" id="channelForm"><input type="hidden" name="id" id="c_id"><label>Kantor<select name="office_id" id="c_office">{% for o in offices %}<option value="{{o.id}}">{{o.name}}</option>{% endfor %}</select></label><label>Nama<input name="name" id="c_name" placeholder="Contoh G6 - DANA" required></label><label>Kategori<select name="category" id="c_category"><option>Deposit</option><option>Withdraw</option><option>Livechat</option><option>Pulsa</option><option>QRIS</option><option>Lainnya</option></select></label><label>Alias form<input name="aliases" id="c_aliases" placeholder="Pisahkan dengan koma"></label><label>Status<select name="status" id="c_status"><option>Aktif</option><option>Nonaktif</option></select></label><div class="form-actions"><button type="button" class="btn secondary" onclick="resetChannel()">Batal / Baru</button><button id="c_submit">Simpan Channel</button></div></form><div class="table-wrap"><table><tr><th>Kantor</th><th>Nama</th><th>Kategori</th><th>Alias</th><th>Status</th><th>Aksi</th></tr>{% for r in rows %}<tr><td>{{r.office_name}}</td><td>{{r.name}}</td><td>{{r.category}}</td><td>{{r.aliases or '-'}}</td><td><span class="badge {{'ok' if r.status=='Aktif' else 'muted'}}">{{r.status}}</span></td><td><div class="actions"><button type="button" class="btn small" onclick='editChannel({{r.id}},{{r.office_id}},{{r.name|tojson}},{{r.category|tojson}},{{(r.aliases or "")|tojson}},{{r.status|tojson}})'>Edit</button><form method="post" action="{{url_for('channel_delete',cid=r.id)}}" onsubmit="return confirm('Hapus channel ini?')"><button class="btn small danger">Hapus</button></form></div></td></tr>{% endfor %}</table></div><script>function editChannel(id,o,n,c,a,s){c_id.value=id;c_office.value=o;c_name.value=n;c_category.value=c;c_aliases.value=a;c_status.value=s;c_submit.textContent='Update Channel';window.scrollTo({top:0,behavior:'smooth'})}function resetChannel(){channelForm.reset();c_id.value='';c_submit.textContent='Simpan Channel'}</script>{% endblock %}
