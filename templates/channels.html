{% extends 'base.html' %}{% block content %}<h1>Master Bank / Channel</h1><form method="post" class="card formgrid"><select name="office_id">{% for o in offices %}<option value="{{o.id}}">{{o.name}}</option>{% endfor %}</select><input name="name" placeholder="Contoh G6 - DANA" required><select name="category"><option>Deposit</option><option>Withdraw</option><option>Livechat</option><option>Pulsa</option><option>QRIS</option></select><input name="aliases" placeholder="Alias form, pisahkan koma"><select name="status"><option>Aktif</option><option>Nonaktif</option></select><button>Simpan</button></form><table><tr><th>Kantor</th><th>Nama</th><th>Kategori</th><th>Alias</th></tr>{% for r in rows %}<tr><td>{{r.office_name}}</td><td>{{r.name}}</td><td>{{r.category}}</td><td>{{r.aliases}}</td></tr>{% endfor %}</table>{% endblock %}
