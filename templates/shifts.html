{% extends 'base.html' %}{% block content %}<h1>Master Shift</h1><form method="post" class="card formgrid"><select name="office_id">{% for o in offices %}<option value="{{o.id}}">{{o.name}}</option>{% endfor %}</select><input name="name" placeholder="Nama shift" required><input name="code" placeholder="Kode"><input type="time" name="start_time" required><input type="time" name="end_time" required><select name="status"><option>Aktif</option><option>Nonaktif</option></select><button>Simpan Shift</button></form><table><tr><th>Kantor</th><th>Shift</th><th>Kode</th><th>Jam</th><th>Status</th></tr>{% for r in rows %}<tr><td>{{r.office_name}}</td><td>{{r.name}}</td><td>{{r.code}}</td><td>{{r.start_time}}–{{r.end_time}}</td><td>{{r.status}}</td></tr>{% endfor %}</table>{% endblock %}
