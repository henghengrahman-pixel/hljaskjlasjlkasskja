{% extends 'base.html' %}{% block content %}<div class="page-head"><div><h1>Master Kantor</h1><p>Semua kantor dapat ditambah, diedit, dinonaktifkan, atau dihapus.</p></div></div><form method="post" class="card formgrid" id="officeForm"><input type="hidden" name="id" id="o_id"><label>Nama kantor<input name="name" id="o_name" required></label><label>Lokasi umum<input name="location" id="o_location"></label><label>Status<select name="status" id="o_status"><option>Aktif</option><option>Nonaktif</option></select></label><div class="form-actions"><button type="button" class="btn secondary" onclick="resetOffice()">Batal / Baru</button><button id="o_submit">Simpan Kantor</button></div></form><div class="table-wrap"><table><tr><th>Nama</th><th>Lokasi</th><th>Status</th><th>Aksi</th></tr>{% for r in rows %}<tr><td><a class="office-link" href="{{url_for('office_detail',oid=r.id)}}"><b>{{r.name}}</b><small>Lihat staf & detail</small></a></td><td>{{r.location}}</td><td><span class="badge {{'ok' if r.status=='Aktif' else 'muted'}}">{{r.status}}</span></td><td><div class="actions"><a class="btn small secondary" href="{{url_for('office_detail',oid=r.id)}}">Detail</a><button type="button" class="btn small" onclick='editOffice({{r.id}},{{r.name|tojson}},{{(r.location or "")|tojson}},{{r.status|tojson}})'>Edit</button><form method="post" action="{{url_for('office_delete',oid=r.id)}}" onsubmit="return confirm('Hapus kantor ini?')"><button class="btn small danger">Hapus</button></form></div></td></tr>{% endfor %}</table></div><script>function editOffice(id,n,l,s){o_id.value=id;o_name.value=n;o_location.value=l;o_status.value=s;o_submit.textContent='Update Kantor';window.scrollTo({top:0,behavior:'smooth'})}function resetOffice(){officeForm.reset();o_id.value='';o_submit.textContent='Simpan Kantor'}</script>{% endblock %}
