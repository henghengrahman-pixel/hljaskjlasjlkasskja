{% extends 'base.html' %}{% block content %}<h1>Ex Karyawan</h1><form method="post" class="card formgrid"><select name="staff_id">{% for s in active %}<option value="{{s.id}}">{{s.name}}</option>{% endfor %}</select><input type="date" name="exit_date" required><input name="exit_reason" placeholder="Alasan keluar" required><button>Pindahkan ke Ex Karyawan</button></form><table><tr><th>Nama</th><th>Kantor Terakhir</th><th>Tanggal Keluar</th><th>Alasan</th></tr>{% for r in rows %}<tr><td>{{r.name}}</td><td>{{r.office_name}}</td><td>{{r.exit_date}}</td><td>{{r.exit_reason}}</td></tr>{% endfor %}</table>{% endblock %}
