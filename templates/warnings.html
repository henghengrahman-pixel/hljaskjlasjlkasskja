{% extends 'base.html' %}{% block content %}<h1>SP / Peringatan</h1><form method="post" class="card formgrid"><select name="staff_id">{% for s in staff %}<option value="{{s.id}}">{{s.name}}</option>{% endfor %}</select><select name="type"><option>Teguran</option><option>SP1</option><option>SP2</option><option>SP3</option></select><input type="date" name="warning_date" required><input name="reason" placeholder="Alasan" required><input type="number" name="fine" placeholder="Denda"><textarea name="notes" placeholder="Catatan"></textarea><button>Simpan</button></form><table><tr><th>Staf</th><th>Kantor</th><th>Jenis</th><th>Tanggal</th><th>Alasan</th><th>Denda</th></tr>{% for r in rows %}<tr><td>{{r.name}}</td><td>{{r.office_name}}</td><td>{{r.type}}</td><td>{{r.warning_date}}</td><td>{{r.reason}}</td><td>Rp{{'{:,}'.format(r.fine)}}</td></tr>{% endfor %}</table>{% endblock %}
