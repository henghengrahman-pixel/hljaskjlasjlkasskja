{% extends 'base.html' %}{% block page_title %}Akun Saya{% endblock %}{% block content %}<div class="page-head"><div><h1>Akun Saya</h1><p>Ganti password dan atur tampilan dashboard.</p></div></div><div class="account-grid"><form method="post" class="card account-card"><h2>Ganti Password</h2><label>Password Lama<input type="password" name="old_password" required></label><label>Password Baru<input type="password" name="new_password" minlength="8" required></label><button class="btn">Ganti Password</button></form><div class="card account-card"><h2>Tampilan</h2><p>Pilih mode yang nyaman untuk digunakan.</p><div class="theme-choice"><a class="theme-card {% if g.theme=='dark' %}selected{% endif %}" href="{{url_for('set_theme',mode='dark')}}">☾<b>Dark</b></a><a class="theme-card {% if g.theme=='light' %}selected{% endif %}" href="{{url_for('set_theme',mode='light')}}">☀<b>Light</b></a></div></div></div>{% endblock %}
