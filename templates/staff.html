{% extends 'base.html' %}{% block content %}<h1>Data Staf & Akun</h1><form method="post" class="card formgrid"><input name="name" placeholder="Nama staf" required><input name="cs_name" placeholder="Nama CS"><input name="agent_code" placeholder="Kode agent"><input name="telegram_id" placeholder="Telegram ID"><input name="telegram_username" placeholder="Username Telegram"><input name="email" placeholder="Email kerja"><select name="office_id">{% for o in offices %}<option value="{{o.id}}">{{o.name}}</option>{% endfor %}</select><select name="position"><option>CS</option><option>Leader</option><option>Supervisor</option><option>Admin</option></select><select name="status"><option>Aktif</option><option>Off</option><option>Resign</option></select><input type="date" name="join_date"><input name="login_id" placeholder="ID login staf"><input name="password" placeholder="Password awal"><textarea name="notes" placeholder="Catatan"></textarea><button>Simpan Staf</button></form><table><tr><th>Nama</th><th>CS</th><th>Kantor</th><th>Agent</th><th>ID Login</th><th>Status</th><th>Reset Password</th></tr>{% for r in rows %}<tr><td>{{r.name}}</td><td>{{r.cs_name}}</td><td>{{r.office_name}}</td><td>{{r.agent_code}}</td><td>{{r.login_id or '-'}}</td><td>{{r.status}}</td><td><form method="post" action="{{url_for('reset_password',sid=r.id)}}" class="inline"><input name="password" placeholder="Password baru"><button>Reset</button></form></td></tr>{% endfor %}</table>{% endblock %}
