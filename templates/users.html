{% extends 'base.html' %}{% block content %}<h1>Akses User</h1><section><form method="post" class="form-grid"><label>Staf<select name="staff_id">{% for s in staff %}<option value="{{s.id}}">{{s.name}}</option>{% endfor %}</select></label><label>Username<input name="username" required></label><label>Password<input type="password" name="password" placeholder="Kosongkan jika tidak ganti"></label><label>Role<select name="role"><option>staff</option><option>leader</option><option>supervisor</option></select></label><label><input type="checkbox" name="is_active" checked> Aktif</label><fieldset><legend>Menu staf</legend><label><input type="checkbox" name="menus" value="my_dashboard" checked> Dashboard Saya</label><label><input type="checkbox" name="menus" value="inout" checked> IN/OUT</label><label><input type="checkbox" name="menus" value="jobdesk"> Lihat Jobdesk</label></fieldset><button>Simpan Akses</button></form></section><section><div class="table"><table><tr><th>Username</th><th>Staf</th><th>Role</th><th>Kantor</th><th>PC</th><th></th></tr>{% for r in rows %}<tr><td>{{r.username}}</td><td>{{r.staff_name or '-'}}</td><td>{{r.role}}</td><td>{{r.office_name or '-'}}</td><td>{{'Terikat' if r.device_token else 'Belum'}}</td><td><form method="post" action="/users/reset-device/{{r.id}}"><button>Reset PC</button></form></td></tr>{% endfor %}</table></div></section>{% endblock %}
