{% extends 'base.html' %}{% block content %}<div class="top"><h1>Jobdesk</h1><form><input type="date" name="date" value="{{date}}" onchange="this.form.submit()"></form></div><section><form method="post" class="form-grid"><input type="hidden" name="id"><label>Tanggal<input type="date" name="work_date" value="{{date}}" required></label><label>Kantor<select name="office_id" required>{% for o in offices %}<option value="{{o.id}}">{{o.name}}</option>{% endfor %}</select></label><label>Shift<select name="shift_id" required>{% for s in shifts %}<option value="{{s.id}}">{{s.name}} ({{s.start_time}}–{{s.end_time}})</option>{% endfor %}</select></label><label>Staf<select name="staff_id" required>{% for s in staff %}<option value="{{s.id}}">{{s.name}} — {{s.cs_name or '-'}}</option>{% endfor %}</select></label><label>Kategori<select name="category"><option>Livechat</option><option>Deposit Bank</option><option>Withdraw Bank</option><option>Pulsa</option><option>QRIS</option></select></label><label>Target / Pegangan<input name="target" placeholder="BRI DP 1 / Livechat 1" required></label><label>Mulai<input type="time" name="start_time" value="06:00" required></label><label>Selesai<input type="time" name="end_time" value="18:00" required></label><button>Simpan Jobdesk</button></form></section><section><div class="table"><table><tr><th>Kantor</th><th>Shift</th><th>Jam</th><th>Staf/CS</th><th>Jobdesk</th><th></th></tr>{% for r in rows %}<tr><td>{{r.office_name}}</td><td>{{r.shift_name}}</td><td>{{r.start_time}}–{{r.end_time}}</td><td>{{r.staff_name}}<small>{{r.cs_name or '-'}}</small></td><td>{{r.category}} — {{r.target}}</td><td><form method="post" action="/assignments/delete/{{r.id}}"><button class="danger">Hapus</button></form></td></tr>{% endfor %}</table></div></section>{% endblock %}
