{% extends 'base.html' %}{% block content %}<h1>Set Off Day</h1><section><form method="post" class="form-grid"><label>Staf<select name="staff_id">{% for s in staff %}<option value="{{s.id}}">{{s.name}} — {{s.cs_name or '-'}}</option>{% endfor %}</select></label><label>Tanggal Off<input type="date" name="off_date" required></label><label>Catatan<input name="notes"></label><button>Set Off Day</button></form></section><section><div class="table"><table><tr><th>Tanggal</th><th>Staf</th><th>CS</th><th>Kantor</th><th>Catatan</th></tr>{% for r in rows %}<tr><td>{{r.off_date}}</td><td>{{r.name}}</td><td>{{r.cs_name or '-'}}</td><td>{{r.office_name}}</td><td>{{r.notes or '-'}}</td></tr>{% endfor %}</table></div></section>{% endblock %}
